[package]
name = "certy"
version = "0.1.0"
description = "Expiry tracker for API tokens and certificates"
authors = ["Certy"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "certy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
aes-gcm = "0.10"
base64 = "0.22"
x509-parser = "0.16"
p12-keystore = "0.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Windows Hello / Windows Security prompt before revealing secrets (src/lock.rs)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_Security_Credentials", "Win32_Security", "Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Gdi", "Foundation"] }
windows-future = "0.2"
